        /* ── CMD STRIP ── */
        .cmd-strip {
            pointer-events: all;
            margin: 11px 14px 0;
            height: 46px;
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);

            flex-direction: column;

        }

        .chat-msgs {
            height: 200px;
            overflow-y: auto;
            padding: 10px 13px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .chat-msgs::-webkit-scrollbar {
            width: 2px
        }

        .chat-msgs::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 3px
        }

        .cmsg {
            display: flex;
            gap: 7px;
            align-items: flex-start;
            animation: fadeUp .18s ease
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .cmsg-av {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 9px;
            font-weight: 500
        }

        .cms .cmsg-av {
            background: var(--acc-bg);
            color: var(--acc2)
        }

        .cmu {
            flex-direction: row-reverse
        }

        .cmu .cmsg-av {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text3)
        }

        .cmsg-b {
            max-width: 84%;
            padding: 6px 10px;
            border-radius: 9px;
            font-size: 12px;
            line-height: 1.55
        }

        .cms .cmsg-b {
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid var(--border);
            color: var(--text)
        }

        .cmu .cmsg-b {
            background: var(--acc-bg);
            border: 0.5px solid var(--acc-b);
            color: var(--text)
        }

        .csrc {
            display: inline-flex;
            align-items: center;
            font-family: var(--mono);
            font-size: 9px;
            color: var(--acc2);
            background: var(--acc-bg);
            padding: 1px 5px;
            border-radius: 3px;
            margin-top: 4px;
            cursor: pointer
        }

        .tping {
            display: flex;
            gap: 3px;
            align-items: center;
            padding: 2px 0
        }

        .tping span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text3);
            animation: tp .8s infinite
        }

        .tping span:nth-child(2) {
            animation-delay: .18s
        }

        .tping span:nth-child(3) {
            animation-delay: .36s
        }

        @keyframes tp {

            0%,
            60%,
            100% {
                transform: translateY(0)
            }

            30% {
                transform: translateY(-4px)
            }
        }

        .chat-foot {
            display: flex;
            gap: 7px;
            align-items: center;
            padding: 8px 11px;
            border-top: 0.5px solid var(--border)
        }

        .ci-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.04);
            border: 0.5px solid var(--border2);
            border-radius: 8px;
            padding: 6px 10px;
            transition: border-color .15s
        }

        .ci-wrap:focus-within {
            border-color: var(--acc-b)
        }

        .ci {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 12px;
            font-family: var(--sans);
            resize: none;
            line-height: 1.5;
            max-height: 56px;
            caret-color: var(--acc2)
        }

        .ci::placeholder {
            color: var(--text4)
        }

        .ci-k {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--text4);
            flex-shrink: 0
        }

        .send-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: none;
            background: var(--acc);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity .15s
        }

        .send-btn:hover {
            opacity: .8
        }

        .send-btn svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round
        }

        /* show chat */
        .chat-overlay.open {
            pointer-events: all
        }

        .chat-overlay.open .chat-backdrop {
            opacity: 1
        }

        .chat-overlay.open .chat-pane {
            transform: translateY(0);
            opacity: 1
        }

        /* ── TRAY PILL ── */
        .tray-pill {
            pointer-events: all;
            position: absolute;
            bottom: 50px;
            right: 14px;
            display: none;
            align-items: center;
            gap: 7px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid var(--border2);
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .4);
            animation: slideUp .2s ease;
        }

        .tray-pill.show {
            display: flex
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .tp-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--teal);
            animation: pulse 2s infinite
        }

        .tp-text {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text2);
            letter-spacing: .04em
        }

        .tp-ct {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--acc);
            font-family: var(--mono);
            font-size: 9px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center
        }

        /* ── QUICK CAPTURE ── */
        .capture {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 14vh;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s;
            z-index: 50
        }

        .capture.open {
            opacity: 1;
            pointer-events: all
        }

        .cap-box {
            width: 460px;
            background: rgba(9, 9, 22, 0.97);
            border: 0.5px solid var(--border3);
            border-radius: 13px;
            overflow: hidden;
            box-shadow: 0 22px 56px rgba(0, 0, 0, .75);
            transform: translateY(-6px);
            transition: transform .15s
        }

        .capture.open .cap-box {
            transform: translateY(0)
        }

        .cap-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 13px
        }

        .cap-ic {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: var(--acc-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        .cap-ic svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: var(--acc2);
            stroke-width: 2;
            stroke-linecap: round
        }

        .cap-in {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 13px;
            font-family: var(--sans);
            caret-color: var(--acc2)
        }

        .cap-in::placeholder {
            color: var(--text4)
        }

        .cap-modes {
            display: flex;
            gap: 2px;
            padding: 5px 8px;
            border-top: 0.5px solid var(--border)
        }

        .cpm {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 5px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--text3);
            cursor: pointer;
            transition: all .12s
        }

        .cpm:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text2)
        }

        .cpm.act {
            background: var(--acc-bg);
            color: var(--acc2)
        }

        .cpm svg {
            width: 9px;
            height: 9px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round
        }

        .cap-hint {
            margin-left: auto;
            font-family: var(--mono);
            font-size: 9px;
            color: var(--text4)
        }

        .cap-hint b {
            background: rgba(255, 255, 255, 0.06);
            padding: 1px 5px;
            border-radius: 3px;
            border: 0.5px solid var(--border);
            color: var(--text3);
            font-weight: 400
        }

        /* toast */
        .toast {
            position: absolute;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid var(--acc-b);
            border-radius: 10px;
            padding: 7px 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
            pointer-events: all;
            white-space: nowrap;
            animation: toastIn .3s ease;
            z-index: 20
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }

        .toast.gone {
            display: none
        }

        .toast-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--acc2);
            animation: pulse 2s infinite;
            flex-shrink: 0
        }

        .toast-txt {
            font-size: 12px;
            color: var(--text)
        }

        .toast-sub {
            font-size: 11px;
            color: var(--text2)
        }

        .toast-x {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 11px;
            cursor: pointer;
            padding: 0 2px;
            margin-left: 2px;
            line-height: 1
        }

        /* hint bar at very bottom of overlay */
        .hint-bar {
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 5px 0 7px;
            flex-shrink: 0;
        }

        .hb-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--mono);
            font-size: 9px;
            color: rgba(255, 255, 255, 0.14)
        }

        .hb-k {
            background: rgba(255, 255, 255, 0.06);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            padding: 1px 5px;
            color: rgba(255, 255, 255, 0.2)
        }

        /* Add blurred dark backdrop behind the entire overlay */
        .overlay {
            position: relative;
        }

        .overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            pointer-events: none;
            z-index: 0;
        }

        .overlay>* {
            position: relative;
            z-index: 1;
        }

        /* Update root variables for lighter glass */
        :root {
            --glass: rgba(40, 40, 60, 0.85);
            /* lighter, more opaque */
            --glass2: rgba(50, 50, 70, 0.9);
            --glass3: rgba(60, 60, 80, 0.95);
            --border: rgba(255, 255, 255, 0.15);
            --border2: rgba(255, 255, 255, 0.25);
            --text: #ffffff;
            /* pure white for main text */
            --text2: rgba(255, 255, 255, 0.85);
            --text3: rgba(255, 255, 255, 0.6);
            --text4: rgba(255, 255, 255, 0.4);
        }

        /* Increase panel widths */
        .left-panel,
        .right-panel {
            width: 320px;
            /* was 270px */
        }

        /* Slightly larger font sizes */
        .gc-body {
            font-size: 12px;
            /* was 11.5px */
        }

        .nr-txt,
        .tr-txt,
        .dv-title {
            font-size: 12px;
        }

        .cmd-strip {
            height: 50px;
            /* was 46px */
            margin: 14px 14px 0;
        }

        .cs-in {
            font-size: 14px;
            /* was 13px */
        }

        .state-chip {
            font-size: 11px;
            /* was 10px */
        }
    </style>
</head>

<body>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay">
        <!-- CMD STRIP -->
        <div class="cmd-strip" id="cmdStrip">
            <div class="cs-logo"><svg viewBox="0 0 12 12">
                    <circle cx="6" cy="6" r="2" />
                    <path d="M6 1v2M6 9v2M1 6h2M9 6h2" />
                </svg></div>
            <div class="cmd-mode-badge cmb-default" id="modeBadge">PCOS</div>
            <input class="cs-in" id="csIn" placeholder="search, /note, /task, or ? to chat…" autocomplete="off"
                spellcheck="false">
            <span class="cmd-hint-txt" id="cmdHint">⌘K</span>
            <div class="cmd-div"></div>
            <div class="state-chip sc-deep" id="stateChip">
                <div class="sdot"></div>
                <span id="stateLbl">deep_work</span>
            </div>
            <div class="cmd-div"></div>
            <span class="cs-clock" id="osClock"></span>
            <button class="cs-close" id="closeOverlayBtn" title="Esc">
                <svg viewBox="0 0 10 10">
                    <path d="M2 2l6 6M8 2l-6 6" />
                </svg>
            </button>

            <!-- SEARCH RESULTS DROPDOWN (dynamic) -->
            <div class="cmd-results" id="cmdResults"></div>
        </div>

        <!-- MID ROW -->
        <div class="mid-row">
            <!-- LEFT PANEL -->
            <div class="left-panel">
                <div class="gc">
                    <div class="gc-head">
                        <div class="gc-label">
                            <div class="gc-icon gi-acc"><svg viewBox="0 0 8 8">
                                    <path d="M1 1.5h6M1 3.5h5M1 5.5h4" />
                                </svg></div>recent
                        </div>
                    </div>
                    <div class="gc-body" id="recentNotesBody"></div>
                </div>
                <div class="gc">
                    <div class="gc-head">
                        <div class="gc-label">
                            <div class="gc-icon gi-amber"><svg viewBox="0 0 8 8">
                                    <path d="M1 2l1.5 1.5L6 1M1 5l1.5 1.5L6 4.5" />
                                </svg></div>tasks
                        </div>
                        <span style="font-family:var(--mono);font-size:9px;color:var(--red)" id="taskCount">0
                            open</span>
                    </div>
                    <div class="gc-body" id="tasksBody"></div>
                </div>
            </div>

            <!-- CENTER ZONE -->
            <div class="center-zone">
                <div class="toast" id="toast" style="display:none">
                    <div class="toast-dot"></div>
                    <span class="toast-txt"></span>
                    <span class="toast-sub"></span>
                    <button class="toast-x">✕</button>
                </div>
                <div class="center-hud">
                    <div class="focus-ring">
                        <svg class="arc-svg" viewBox="0 0 122 122">
                            <g class="arc-spin">
                                <circle cx="61" cy="61" r="57" fill="none" stroke="rgba(108,92,231,0.1)"
                                    stroke-width="0.5" stroke-dasharray="4 8" />
                            </g>
                            <path d="M61 4 A57 57 0 0 1 118 61" fill="none" stroke="rgba(108,92,231,0.22)"
                                stroke-width="1" stroke-linecap="round" />
                        </svg>
                        <div>
                            <div class="fr-time" id="centerClock"></div>
                            <div class="fr-lbl" id="centerState">—</div>
                        </div>
                    </div>
                    <div class="mini-strip" id="statsStrip">
                        <div class="ms2">
                            <div class="ms2-v" id="noteCount">0</div>
                            <div class="ms2-l">notes</div>
                        </div>
                        <div class="ms2">
                            <div class="ms2-v" id="focusScore">0</div>
                            <div class="ms2-l">focus</div>
                        </div>
                        <div class="ms2">
                            <div class="ms2-v" id="nodeCount">0</div>
                            <div class="ms2-l">nodes</div>
                        </div>
                        <div class="ms2">
                            <div class="ms2-v" id="openTaskCt">0</div>
                            <div class="ms2-l">tasks</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel">
                <div class="gc">
                    <div class="gc-head">
                        <div class="gc-label">
                            <div class="gc-icon gi-acc"><svg viewBox="0 0 8 8">
                                    <path d="M4 1v6M2 3l2-2 2 2" />
                                </svg></div>diverge
                        </div>
                        <span class="gc-badge" id="divergenceNewBadge">0 new</span>
                    </div>
                    <div class="gc-body" id="divergenceBody"></div>
                </div>
                <div class="gc">
                    <div class="gc-head">
                        <div class="gc-label">
                            <div class="gc-icon gi-teal"><svg viewBox="0 0 8 8">
                                    <circle cx="4" cy="4" r="2.5" />
                                    <path d="M4 1.5V3M4 5v1.5M1.5 4H3" />
                                </svg></div>context
                        </div>
                    </div>
                    <div class="gc-body">
                        <div class="xrow"><span class="xk">window</span><span class="xv" id="activeWindow">—</span>
                        </div>
                        <div class="xrow"><span class="xk">state</span><span id="contextStatePill"
                                class="xpill xp-deep"><span class="sdot" style="width:4px;height:4px"></span>—</span>
                        </div>
                        <div class="xrow"><span class="xk">focus</span><span class="xpill xp-acc" id="focusMinutes">0
                                min</span></div>
                        <div class="xrow"><span class="xk">api</span><span class="xpill xp-ok">● ok</span></div>
                        <div class="fbar">
                            <div class="fbar-f" id="focusBar" style="width:0%"></div>
                        </div>
                        <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-align:right;margin-top:2px"
                            id="focusDaily">0 / 100 pts today</div>
                    </div>
                </div>
                <div class="gc" style="cursor:pointer" id="chatToggleCard">
                    <div class="gc-body" style="flex-direction:row;align-items:center;gap:9px;padding:9px 11px">
                        <div class="gc-icon gi-acc" style="width:18px;height:18px"><svg viewBox="0 0 8 8"
                                style="width:10px;height:10px">
                                <path d="M1 1.5h6a.5.5 0 010 1v3H4.5L3 6.5V5.5H1.5A.5.5 0 011 5V2a.5.5 0 010-1z" />
                            </svg></div>
                        <span style="font-family:var(--mono);font-size:10px;color:var(--text2);flex:1">open chat</span>
                        <span style="font-family:var(--mono);font-size:9px;color:var(--text3)">? ⏎</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="hint-bar">
            <div class="hb-item"><span class="hb-k">Ctrl+Alt+P</span>capture</div>
            <div class="hb-item"><span class="hb-k">?</span>chat</div>
            <div class="hb-item"><span class="hb-k">/note</span>note</div>
            <div class="hb-item"><span class="hb-k">/task</span>task</div>
            <div class="hb-item"><span class="hb-k">Esc</span>close</div>
        </div>

        <!-- CHAT OVERLAY (slide up) -->
        <div class="chat-overlay" id="chatOverlay">
            <div class="chat-backdrop"></div>
            <div class="chat-pane">
                <div class="pane-head">
                    <div class="pane-head-l"><svg viewBox="0 0 12 12">
                            <path d="M1 2h10a.5.5 0 01.5.5v7H7L5 11V9.5H1.5A.5.5 0 011 9V2.5A.5.5 0 011 2z" />
                        </svg> pcos chat — answers from your notes & context</div>
                    <button class="ph-close" id="closeChatBtn">✕</button>
                </div>
                <div class="chat-msgs" id="chatMsgs"></div>
                <div class="chat-foot">
                    <div class="ci-wrap"><textarea class="ci" id="chatIn" rows="1"
                            placeholder="ask about your notes, tasks, context…"></textarea><span class="ci-k">⏎</span>
                    </div>
                    <button class="send-btn" id="sendChatBtn"><svg viewBox="0 0 12 12">
                            <path d="M10 6H2M7 3l3 3-3 3" />
                        </svg></button>
                </div>
            </div>
        </div>
    </div>

    <!-- CAPTURE MODAL -->
    <div class="capture" id="capModal">
        <div class="cap-box">
            <div class="cap-row">
                <div class="cap-ic"><svg viewBox="0 0 12 12">
                        <path d="M6 2v8M2 6h8" />
                    </svg></div>
                <input class="cap-in" id="capIn" placeholder="capture a thought…" autocomplete="off" spellcheck="false">
            </div>
            <div class="cap-modes">
                <div class="cpm act" data-mode="note"><svg viewBox="0 0 10 10">
                        <rect x="1" y="1" width="8" height="8" rx="1" />
                        <path d="M3 4h4M3 6h3" />
                    </svg>note</div>
                <div class="cpm" data-mode="task"><svg viewBox="0 0 10 10">
                        <path d="M2 4l1.5 1.5 3.5-3" />
                        <path d="M7 7h2" />
                    </svg>task</div>
                <div class="cpm" data-mode="idea"><svg viewBox="0 0 10 10">
                        <circle cx="5" cy="4" r="2.5" />
                        <path d="M3.5 7h3M4 8.5h2" />
                    </svg>idea</div>
                <div class="cap-hint"><b>⏎</b> save &nbsp;<b>Esc</b> close</div>
            </div>
        </div>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        let bridge = null;
        let currentSessionId = localStorage.getItem('pcos_chat_session') || null;
        let captureMode = 'note';

        // Helper functions
        function showToast(msg, sub = '') {
            const toast = document.getElementById('toast');
            toast.querySelector('.toast-txt').innerText = msg;
            toast.querySelector('.toast-sub').innerText = sub;
            toast.style.display = 'flex';
            setTimeout(() => toast.style.display = 'none', 4000);
        }

        // Clock
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('osClock').innerText = time;
            document.getElementById('centerClock').innerText = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Data loading and UI updates
        async function loadState() {
            const stateData = JSON.parse(await bridge.get_state());
            const state = stateData.state;
            document.getElementById('stateLbl').innerText = state;
            document.getElementById('centerState').innerText = state.replace('_', ' ');
            document.getElementById('contextStatePill').innerHTML = `<span class="sdot" style="width:4px;height:4px"></span> ${state}`;
            const chip = document.getElementById('stateChip');
            chip.className = 'state-chip ' + (state === 'deep_work' ? 'sc-deep' : state === 'distracted' ? 'sc-dist' : 'sc-free');
            return stateData;
        }

        async function loadRecentNotes() {
            const notesData = JSON.parse(await bridge.get_recent_notes(6));
            const notes = notesData.notes || [];
            const container = document.getElementById('recentNotesBody');
            container.innerHTML = '';
            notes.slice(0, 5).forEach(n => {
                const div = document.createElement('div');
                div.className = 'nr';
                div.innerHTML = `<div class="nr-pip" style="background:var(--acc)"></div><div class="nr-txt">${escapeHtml(n.content.substring(0, 80))}</div><span class="nr-t">${n.created_at ? new Date(n.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>`;
                container.appendChild(div);
            });
            document.getElementById('noteCount').innerText = notes.length;
        }

        async function loadTasks() {
            const tasksData = JSON.parse(await bridge.get_tasks());
            const tasks = tasksData.tasks || [];
            const container = document.getElementById('tasksBody');
            container.innerHTML = '';
            tasks.forEach(t => {
                const div = document.createElement('div');
                div.className = 'tr';
                div.innerHTML = `<div class="chk" data-id="${t.id}"></div><div class="pdot pl"></div><span class="tr-txt">${escapeHtml(t.content.substring(0, 60))}</span>`;
                container.appendChild(div);
            });
            document.getElementById('taskCount').innerText = tasks.length + ' open';
            document.getElementById('openTaskCt').innerText = tasks.length;
        }

        async function loadDivergence() {
            const divData = JSON.parse(await bridge.get_divergence_queue());
            const items = divData.items || [];
            const container = document.getElementById('divergenceBody');
            container.innerHTML = '';
            let pendingCount = 0;
            items.forEach(i => {
                if (i.status === 'pending') pendingCount++;
                const div = document.createElement('div');
                div.className = 'dv';
                if (i.status === 'pending') {
                    div.innerHTML = `<div class="dv-dot"></div><div class="dv-b"><div class="dv-title">${escapeHtml(i.suggestion)}</div><div class="dv-sub"><button class="accept-div" data-id="${i.id}">Accept</button> <button class="dismiss-div" data-id="${i.id}">Dismiss</button></div></div>`;
                } else {
                    div.style.opacity = '0.38';
                    div.innerHTML = `<div class="dv-dot" style="background:var(--text3)"></div><div class="dv-b"><div class="dv-title">${escapeHtml(i.suggestion)}</div><div class="dv-sub">${i.status}</div></div>`;
                }
                container.appendChild(div);
            });
            document.getElementById('divergenceNewBadge').innerText = pendingCount + ' new';
        }

        function loadAllData() {
            loadState();
            loadRecentNotes();
            loadTasks();
            loadDivergence();
        }

        // Task completion (event delegation)
        document.getElementById('tasksBody').addEventListener('click', async (e) => {
            const chk = e.target.closest('.chk');
            if (!chk || chk.classList.contains('done')) return;
            const taskId = chk.getAttribute('data-id');
            if (!taskId) return;
            chk.classList.add('done');
            const tr = chk.closest('.tr');
            tr.querySelector('.tr-txt').classList.add('done');
            tr.style.opacity = '0.38';
            const res = JSON.parse(await bridge.complete_task(taskId));
            if (res.status !== 'ok') {
                chk.classList.remove('done');
                tr.querySelector('.tr-txt').classList.remove('done');
                tr.style.opacity = '1';
                showToast('Failed to complete task');
            } else {
                loadTasks(); // refresh counts
            }
        });

        // Divergence accept/dismiss (event delegation)
        document.getElementById('divergenceBody').addEventListener('click', async (e) => {
            const btn = e.target.closest('.accept-div, .dismiss-div');
            if (!btn) return;
            const id = btn.getAttribute('data-id');
            if (btn.classList.contains('accept-div')) {
                await bridge.accept_divergence(id);
                showToast('Accepted');
            } else {
                await bridge.dismiss_divergence(id);
                showToast('Dismissed');
            }
            loadDivergence();
        });

        // Capture modal events
        let currentCaptureMode = 'note';
        document.querySelectorAll('.cap-modes .cpm').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cap-modes .cpm').forEach(b => b.classList.remove('act'));
                btn.classList.add('act');
                currentCaptureMode = btn.getAttribute('data-mode');
                const iconBg = document.querySelector('.cap-ic');
                if (currentCaptureMode === 'task') iconBg.style.background = 'var(--amber-bg)';
                else if (currentCaptureMode === 'idea') iconBg.style.background = 'var(--green-bg)';
                else iconBg.style.background = 'var(--acc-bg)';
            });
        });

        function openCaptureModal() {
            document.getElementById('capModal').classList.add('open');
            document.getElementById('capIn').focus();
        }
        function closeCaptureModal() {
            document.getElementById('capModal').classList.remove('open');
            document.getElementById('capIn').value = '';
        }
        document.getElementById('capModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('capModal')) closeCaptureModal();
        });
        document.getElementById('capIn').addEventListener('keydown', async (e) => {
            if (e.key === 'Escape') { closeCaptureModal(); e.preventDefault(); }
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const content = document.getElementById('capIn').value.trim();
                if (content) {
                    const res = JSON.parse(await bridge.capture(content, currentCaptureMode));
                    if (res.status === 'ok') {
                        showToast(`${currentCaptureMode} captured`);
                        closeCaptureModal();
                        loadAllData();
                    } else {
                        showToast('Error: ' + (res.error || 'unknown'));
                    }
                } else closeCaptureModal();
            }
        });

        // Chat functionality
        function openChat() {
            document.getElementById('chatOverlay').classList.add('open');
            document.getElementById('chatIn').focus();
        }
        function closeChat() {
            document.getElementById('chatOverlay').classList.remove('open');
        }
        document.getElementById('chatToggleCard').addEventListener('click', openChat);
        document.getElementById('closeChatBtn').addEventListener('click', closeChat);
        document.querySelector('.chat-backdrop').addEventListener('click', closeChat);

        function addChatMessage(role, content) {
            const msgsDiv = document.getElementById('chatMsgs');
            const msgDiv = document.createElement('div');
            msgDiv.className = `cmsg ${role === 'user' ? 'cmu' : 'cms'}`;
            msgDiv.innerHTML = `<div class="cmsg-av">${role === 'user' ? 'Y' : 'P'}</div><div><div class="cmsg-b">${content}</div></div>`;
            msgsDiv.appendChild(msgDiv);
            msgsDiv.scrollTop = msgsDiv.scrollHeight;
        }

        let isWaitingForChat = false;
        async function sendChatMessage() {
            if (isWaitingForChat) return;
            const input = document.getElementById('chatIn');
            const msg = input.value.trim();
            if (!msg) return;
            addChatMessage('user', msg);
            input.value = '';
            input.style.height = 'auto';
            // typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'cmsg cms';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="cmsg-av">P</div><div><div class="cmsg-b"><div class="tping"><span></span><span></span><span></span></div></div></div>';
            document.getElementById('chatMsgs').appendChild(typingDiv);
            isWaitingForChat = true;
            try {
                const response = await bridge.send_chat(msg, currentSessionId || '');
                const data = JSON.parse(response);
                if (data.session_id) currentSessionId = data.session_id;
                if (data.response) {
                    addChatMessage('assistant', data.response);
                } else {
                    addChatMessage('assistant', 'Sorry, I could not respond.');
                }
            } catch (err) {
                addChatMessage('assistant', 'Error connecting to chat service.');
            } finally {
                const typing = document.getElementById('typingIndicator');
                if (typing) typing.remove();
                isWaitingForChat = false;
            }
        }
        document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
        document.getElementById('chatIn').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // Command bar
        const cmdInput = document.getElementById('csIn');
        const resultsDiv = document.getElementById('cmdResults');
        const modeSpan = document.getElementById('modeBadge');
        const hintSpan = document.getElementById('cmdHint');

        let searchDebounce = null;
        cmdInput.addEventListener('input', () => {
            const val = cmdInput.value;
            if (val.startsWith('?')) {
                modeSpan.className = 'cmd-mode-badge cmb-chat';
                modeSpan.textContent = 'chat';
                hintSpan.textContent = '⏎ to open';
                resultsDiv.style.display = 'none';
            } else if (val.startsWith('/note ')) {
                modeSpan.className = 'cmd-mode-badge cmb-note';
                modeSpan.textContent = 'note';
                hintSpan.textContent = '⏎ to save';
                resultsDiv.style.display = 'none';
            } else if (val.startsWith('/task ')) {
                modeSpan.className = 'cmd-mode-badge cmb-task';
                modeSpan.textContent = 'task';
                hintSpan.textContent = '⏎ to save';
                resultsDiv.style.display = 'none';
            } else if (val.startsWith('/idea ')) {
                modeSpan.className = 'cmd-mode-badge cmb-green';
                modeSpan.textContent = 'idea';
                hintSpan.textContent = '⏎ to save';
                resultsDiv.style.display = 'none';
            } else if (val.length > 1 && !val.startsWith('/') && !val.startsWith('?')) {
                modeSpan.className = 'cmd-mode-badge cmb-search';
                modeSpan.textContent = 'search';
                hintSpan.textContent = 'searching...';
                if (searchDebounce) clearTimeout(searchDebounce);
                searchDebounce = setTimeout(async () => {
                    const results = JSON.parse(await bridge.search_notes(val));
                    if (results.results && results.results.length) {
                        resultsDiv.innerHTML = '<div class="cr-section"><div class="cr-label">results</div>' +
                            results.results.map(r => `<div class="cr-item" data-content="${escapeHtml(r.content)}"><div class="cr-pip" style="background:var(--acc)"></div><div class="cr-text">${escapeHtml(r.content.substring(0, 70))}</div></div>`).join('') +
                            '</div>';
                        resultsDiv.style.display = 'block';
                    } else {
                        resultsDiv.style.display = 'none';
                    }
                }, 300);
            } else {
                modeSpan.className = 'cmd-mode-badge cmb-default';
                modeSpan.textContent = 'PCOS';
                hintSpan.textContent = '⌘K';
                resultsDiv.style.display = 'none';
            }
        });

        cmdInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Escape') {
                if (cmdInput.value) {
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                } else {
                    bridge.close_overlay();
                }
                e.preventDefault();
            }
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const val = cmdInput.value.trim();
                if (!val) return;
                if (val.startsWith('?')) {
                    openChat();
                    const query = val.slice(1).trim();
                    if (query) {
                        document.getElementById('chatIn').value = query;
                        sendChatMessage();
                    }
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                } else if (val.startsWith('/note ')) {
                    const content = val.slice(6).trim();
                    if (content) {
                        const res = JSON.parse(await bridge.capture(content, 'note'));
                        if (res.status === 'ok') showToast('Note captured');
                        else showToast('Error capturing note');
                        loadAllData();
                    }
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                } else if (val.startsWith('/task ')) {
                    const content = val.slice(6).trim();
                    if (content) {
                        const res = JSON.parse(await bridge.capture(content, 'task'));
                        if (res.status === 'ok') showToast('Task captured');
                        else showToast('Error capturing task');
                        loadAllData();
                    }
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                } else if (val.startsWith('/idea ')) {
                    const content = val.slice(6).trim();
                    if (content) {
                        const res = JSON.parse(await bridge.capture(content, 'idea'));
                        if (res.status === 'ok') showToast('Idea captured');
                        else showToast('Error capturing idea');
                        loadAllData();
                    }
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                } else if (val.length > 1) {
                    // treat as search query and open chat with results
                    openChat();
                    document.getElementById('chatIn').value = val;
                    sendChatMessage();
                    cmdInput.value = '';
                    cmdInput.dispatchEvent(new Event('input'));
                }
            }
        });

        // Click outside search results to close
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.cmd-strip')) resultsDiv.style.display = 'none';
        });

        // State chip click to cycle override
        document.getElementById('stateChip').addEventListener('click', async () => {
            const states = ['deep_work', 'free', 'distracted', 'meeting', 'wind_down'];
            const current = document.getElementById('stateLbl').innerText;
            let next = states[(states.indexOf(current) + 1) % states.length];
            await bridge.override_state(next, 30);
            loadState();
        });

        // Close overlay button
        document.getElementById('closeOverlayBtn').addEventListener('click', () => {
            if (bridge) bridge.close_overlay();
        });

        // Initial bridge connection
        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            window.bridge = bridge;
            loadAllData();
            setInterval(loadAllData, 15000); // refresh every 15 seconds
        });

        // Simple escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function (m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>

</html>
